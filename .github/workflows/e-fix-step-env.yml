name: E fix step env
on: [push, workflow_dispatch]
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: "v0.0.0"
      SLACK_WEBHOOK_URL: ${{ secrets.SOME_KEY }}
    steps:
      - run: echo "build step"
      - name: Notify on Success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        run: echo "notify success (should be SKIPPED, secret is unset)"
      - name: Notify on Failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: echo "notify failure (should be SKIPPED)"
      - name: Proof
        run: echo "workflow parsed and the build step completed"
